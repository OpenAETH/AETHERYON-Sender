services:
  asistente-ejecutivo:
    build: .
    image: asistente-ejecutivo:local
    container_name: asistente-ejecutivo
    # Encendido 24/7: se reinicia ante crash o reinicio del host (no si lo paras a mano)
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Carga todas las credenciales desde el .env (mismas claves que .env.example)
    env_file:
      - .env
    environment:
      - PORT=8000
      # La DB canónica de LeadForge se lee en vivo desde el bind-mount de abajo.
      # api.py respeta LEADFORGE_DB (default: leadforge.db junto a api.py).
      - LEADFORGE_DB=/leadforge/leadforge.db
    # Bind-mount de la raíz de LeadForge (read-only). Se monta el DIRECTORIO, no el
    # archivo: build_db.py hace unlink+create en modo rebuild y un mount de archivo
    # quedaría apuntando a un inode viejo. Así el local (:8000) ve siempre la DB
    # fresca sin rebuild. El deploy de Render usa su propia copia horneada.
    volumes:
      - /mnt/d/LeadForge:/leadforge:ro
    # Healthcheck: si la app deja de responder, Docker marca el contenedor unhealthy
    # y (con restart: unless-stopped) lo reinicia.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # El scheduler evalua la agenda en UTC (datetime.utcnow). Programa los envios en UTC.
